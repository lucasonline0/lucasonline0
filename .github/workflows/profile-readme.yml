name: Profile README stats

on:
  push:
    branches:
      - main
      - feat/profile-readme-terminal
    paths:
      - "update_profile.py"
      - "dark_mode.svg"
      - "light_mode.svg"
      - ".github/workflows/profile-readme.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live GitHub stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python update_profile.py

      - name: Commit refreshed SVGs
        run: |
          git add dark_mode.svg light_mode.svg

          if git diff --cached --quiet; then
            echo "Profile stats are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh live GitHub stats"
          git push origin "HEAD:${GITHUB_REF_NAME}"
